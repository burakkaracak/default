<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body><title>Otel Ustası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* Tek görünüm: oyun her temada aynı. Tam ekran 3D sahne + üstte arayüz tuvali */
  :root { --sky: #9ecdf2; --sand: #f7e3c0; --ink: #1a2033; --gold: #f2a93b; --track: rgba(255,255,255,0.6); color-scheme: light; }
  html, body { height: 100%; overflow: hidden; background: var(--sky); color: var(--ink); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; filter: saturate(1.16) contrast(1.06); }
  #ui { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 10; touch-action: none; }
  #vig { position: fixed; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.22) 100%); }
  #loading { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-inline: 16px;
    background: linear-gradient(var(--sky), var(--sand)); font-family: Nunito, "Segoe UI", Arial, sans-serif; color: var(--ink); text-align: center; }
  #loading h1 { margin: 0; font-size: clamp(28px, 7vw, 54px); font-weight: 800; letter-spacing: 1px; text-wrap: balance; }
  #loading p { margin: 0; font-weight: 600; opacity: 0.75; }
  #loading .bar { width: min(320px, 70vw); height: 14px; border-radius: 7px; background: var(--track); overflow: hidden; }
  #loadbar { height: 100%; width: 0; background: var(--gold); border-radius: 7px; transition: width .2s; }
  @media (prefers-reduced-motion: reduce) { #loadbar { transition: none; } }
</style>
<div id="loading"><h1>Otel Ustası</h1><div class="bar"><div id="loadbar"></div></div><p>Otel hazırlanıyor…</p></div>
<div id="vig"></div>
<canvas id="ui"></canvas>
<script src="game.js"></script>
</body></html>
