<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Otel Ustası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #9ecdf2; --ink: #1a2033; --gold: #ffcf5a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #12162a; } }
  :root[data-theme="dark"] { --bg: #12162a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; filter: saturate(1.16) contrast(1.06); }
  #ui { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 10; touch-action: none; }
  #vig { position: fixed; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.22) 100%); }
  #loading { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(#9ecdf2, #f7e3c0); font-family: Nunito, Arial, sans-serif; color: #1a2033; }
  #loading h1 { margin: 0; font-size: clamp(28px, 7vw, 54px); font-weight: 800; letter-spacing: 1px; }
  #loading .bar { width: min(320px, 70vw); height: 14px; border-radius: 7px; background: rgba(255,255,255,0.6); overflow: hidden; }
  #loadbar { height: 100%; width: 0; background: #f2a93b; border-radius: 7px; transition: width .2s; }
</style>
</head>
<body>
<div id="loading"><h1>🏨 Otel Ustası</h1><div class="bar"><div id="loadbar"></div></div></div>
<div id="vig"></div>
<canvas id="ui"></canvas>
<script src="game.js"></script>
</body>
</html>
