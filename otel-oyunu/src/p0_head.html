<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Otel Ustası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14263a; --panel:rgba(16,36,56,.9); --panel2:#1f4262; --gold:#f2b632; --gold2:#ffd76a;
    --cream:#fff7e8; --green:#3fbf6f; --red:#e0574f; --muted:#a9bccd; --blue:#2f6fae;
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  }
  /* Loda tasarım dili: Montserrat, altın #9C905C, siyah bant, koyu gri başlık */
  body.loda{--gold:#9C905C;--gold2:#c9bc82;--panel:rgba(17,17,17,.92);--panel2:#2A2A2A;--ink:#111111;--blue:#3A3A3A;--cream:#F4F4F4;--muted:#b8b8b8}
  body.a11y-big #sheetWrap,body.a11y-big #modalWrap,body.a11y-big #hud{zoom:1.18} body.a11y-big .bubble{font-size:23px}
  body.a11y-hc .card,body.a11y-hc .sheet{outline:2px solid #fff;background:#0b1622} body.a11y-hc .btn.ghost{border:2px solid #fff;color:#fff} body.a11y-hc .bubble{border:2px solid #000} body.a11y-hc small,body.a11y-hc .sub,body.a11y-hc .note{color:#e8f0f8}
  body.a11y-motion *,body.a11y-motion *::before,body.a11y-motion *::after{animation-duration:.01s!important;transition-duration:.01s!important}
  body.loda h3,body.loda .ugh,body.loda .tabs button,body.loda .stabs button,body.loda #goal,body.loda .btn{font-family:Montserrat,'Baloo 2',sans-serif;letter-spacing:.2px}
  body.loda .btn{background:linear-gradient(#b3a76e,#9C905C);color:#111;box-shadow:0 3px 0 #6f6640} body.loda .btn.gold{background:linear-gradient(#e6dcae,#9C905C);color:#111} body.loda .btn.ghost{background:#2A2A2A;color:#F4F4F4;box-shadow:0 3px 0 #000}
  body.loda .pill,body.loda .round{border-color:#9C905C} body.loda h3{border-bottom:1px solid #9C905C;padding-bottom:6px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#12293d;}
  body{font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--cream);-webkit-user-select:none;user-select:none;}
  button{font-family:inherit;}
  #game{position:fixed;inset:0;touch-action:none;overflow:hidden;}
  #game canvas{display:block;width:100%;height:100%;}

  /* ---------- world-pinned tags ---------- */
  #tags{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .tag{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap;}
  .tag>*{transform:translate(-50%,-100%);}
  .bubble{background:#fff;color:#1b2a3a;border-radius:14px;padding:1px 8px 2px;font-size:19px;line-height:1.25;box-shadow:0 3px 0 rgba(0,0,0,.2);font-weight:800;position:relative;}
  .bubble::after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff;}
  .bubble.req{outline:3px solid var(--gold);animation:pulse 1s ease-in-out infinite;}
  .bubble.warn{background:#fff0ec;outline:3px solid var(--red);}
  .bubble.small{font-size:15px;padding:0 6px 1px;}
  .bubble.txt{white-space:normal;width:max-content;max-width:260px;text-align:center;overflow-wrap:anywhere;line-height:1.15;padding:2px 8px 3px;} @media (max-width:440px){ .bubble.txt{max-width:200px;} }
  @keyframes pulse{50%{scale:1.12;}}
  .padtag{background:rgba(18,40,60,.9);border:2px solid var(--green);border-radius:12px;padding:0 9px 1px;text-align:center;font-weight:800;font-size:13px;line-height:1.15;}
  .padtag .p{display:block;color:var(--gold2);font-size:16px;}
  .padtag.locked{border-color:#7a8a99;color:#c8d3dd;}
  .padtag.locked .p{color:#c8d3dd;font-size:13px;}
  .patience{width:42px;height:8px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;border:1.5px solid rgba(255,255,255,.8);}
  .patience i{display:block;height:100%;width:100%;transition:width .2s linear;}
  .ring{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--gold2) calc(var(--p,0)*1turn),rgba(0,0,0,.45) 0);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .ring span{width:30px;height:30px;border-radius:50%;background:rgba(18,40,60,.95);display:flex;align-items:center;justify-content:center;}
  .fx{position:absolute;pointer-events:none;font-weight:800;font-size:21px;color:var(--gold2);text-shadow:0 2px 0 #6b4a00,0 0 8px rgba(0,0,0,.45);transform:translate(-50%,-100%);animation:fxUp 1.2s ease-out forwards;white-space:nowrap;}
  .fx.emo{font-size:30px;text-shadow:none;}
  .fx.neg{color:#ff9d8f;text-shadow:0 2px 0 #5a1010;}
  @keyframes fxUp{0%{transform:translate(-50%,-60%) scale(.6);opacity:0}15%{transform:translate(-50%,-100%) scale(1.15);opacity:1}100%{transform:translate(-50%,-260%) scale(1);opacity:0}}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;}
  #hud button{pointer-events:auto;}
  .top{position:absolute;top:calc(8px + var(--st));left:8px;right:8px;display:flex;gap:6px;align-items:center;}
  .pill{background:var(--panel);border:2px solid rgba(242,182,50,.6);border-radius:999px;padding:1px 12px 1px 5px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.28);font-weight:800;height:40px;}
  .money{font-size:21px;min-width:96px;}
  .money.bump{animation:bump .25s ease-out;}
  .money.neg b{color:#ff9d8f;}
  @keyframes bump{50%{transform:scale(1.12);}}
  .coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff5bd,#f2b632 55%,#b0740c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),0 0 0 2px #8a5a06;flex:none;}
  .stars{flex-direction:column;align-items:flex-start;justify-content:center;padding:0 12px;gap:1px;}
  #stars{color:var(--gold2);letter-spacing:1px;font-size:15px;line-height:1;}
  #repBar{width:66px;height:5px;background:rgba(0,0,0,.45);border-radius:3px;overflow:hidden;display:block;}
  #repBar i{display:block;height:100%;background:var(--gold2);width:0;transition:width .4s;}
  .clock{margin-left:auto;font-size:15px;padding:0 12px;gap:5px;}
  .clock small{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;}
  .round{width:40px;height:40px;border-radius:50%;background:var(--panel);border:2px solid rgba(242,182,50,.6);font-size:18px;cursor:pointer;color:var(--cream);box-shadow:0 3px 0 rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;flex:none;}
  #goal{position:absolute;top:calc(56px + var(--st));left:50%;transform:translateX(-50%);background:linear-gradient(#3a82c6,#2a639d);border:2px solid #a8d6ff;border-radius:14px;padding:2px 12px 3px;font-weight:800;font-size:14px;display:none;gap:7px;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.3);pointer-events:auto;cursor:pointer;max-width:94vw;white-space:nowrap;}
  #goal.show{display:flex;}
  #calStrip{white-space:nowrap;position:absolute;top:calc(88px + var(--st));left:50%;transform:translateX(-50%);display:none;gap:4px;background:rgba(20,28,44,.72);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:2px 6px;font-size:13px;cursor:pointer;pointer-events:auto;z-index:5}
  #calStrip .cd{display:flex;align-items:center;gap:3px;padding:1px 6px;border-radius:8px;opacity:.8} #calStrip .cd b{font-size:10px;font-weight:700;opacity:.8} #calStrip .cd.now{background:rgba(255,215,120,.18);opacity:1}
  #goal small{opacity:.85;font-size:12px;} #goal .rew{background:rgba(0,0,0,.22);border-radius:8px;padding:0 6px;font-size:12px;color:#ffe9a8;}
  #goalProg{display:none;position:absolute;left:10px;right:10px;bottom:2px;height:3px;border-radius:2px;background:rgba(0,0,0,.28);overflow:hidden;}
  #goalProg i{display:block;height:100%;width:0;background:var(--gold2);transition:width .3s;}
  #goal .price{color:var(--gold2);}
  #goal.done{background:linear-gradient(#4fc07a,#2f9a58);border-color:#b9f5cf;}
  #side{position:absolute;right:8px;top:calc(100px + var(--st));display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto;}
  .big{width:56px;height:56px;border-radius:18px;background:linear-gradient(#ffd45a,#f29b1d);border:none;box-shadow:0 4px 0 #b06200;font-size:25px;color:#4a2a00;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:800;position:relative;line-height:1;}
  .big small{font-size:11px;margin-top:3px;}
  .big .dot{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--red);border:2px solid #fff;display:none;}
  .big .dot.on{display:block;}
  .big.q{display:none;background:linear-gradient(#8fdcff,#3a8fd6);box-shadow:0 4px 0 #1f5a8a;color:#08263f;}
  .big.q.show{display:flex;}
  .qbar{height:7px;background:#3b5d7c;border-radius:4px;overflow:hidden;margin-top:5px;}
  .qbar i{display:block;height:100%;background:linear-gradient(90deg,#5fd98a,#9ff0b8);border-radius:4px;transition:width .3s;}
  .row.qdone{opacity:.6;}
  #lvlBox{position:absolute;left:8px;top:calc(52px + var(--st));display:flex;align-items:center;gap:5px;background:var(--panel);border:2px solid #8a6ad8;border-radius:999px;padding:1px 8px 1px 2px;height:26px;pointer-events:auto;cursor:pointer;}
  #lvlBox .dot{position:absolute;top:-5px;right:-5px;width:13px;height:13px;border-radius:50%;background:var(--red);border:2px solid #fff;display:none;} #lvlBox .dot.on{display:block;}
  #lvlBox b{background:linear-gradient(#c9b6ff,#8a6ad8);color:#1d0f3f;border-radius:50%;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;}
  #lvlBox span{width:52px;height:6px;background:rgba(0,0,0,.45);border-radius:3px;overflow:hidden;display:block;}
  #lvlBox i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b99cff,#ffd76a);transition:width .3s;}
  #sbBadge{position:absolute;left:50%;top:calc(84px + var(--st));transform:translateX(-50%);background:#8a6ad8;color:#fff;font-weight:800;font-size:12px;padding:2px 10px;border-radius:999px;display:none;pointer-events:auto;cursor:pointer;}
  #sbBadge.show{display:block;}
  #flashFx{position:absolute;inset:0;background:#eef4ff;opacity:0;pointer-events:none;transition:opacity .05s;}
  #comboFx{position:absolute;left:50%;top:34%;transform:translateX(-50%);font-weight:900;font-size:30px;color:#ffd76a;text-shadow:0 3px 0 #7a3b00,0 0 18px rgba(255,160,40,.7);pointer-events:none;opacity:0;transition:opacity .3s;}
  #comboFx.show{opacity:1;} #comboFx.pop{animation:cpop .35s cubic-bezier(.3,1.8,.5,1);}
  @keyframes cpop{from{transform:translateX(-50%) scale(1.6)}}
  #seasonFx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .8s;text-align:center;z-index:5;}
  #seasonFx.show{opacity:1;} #seasonFx div{font-size:90px;animation:tin 1s ease-out;} #seasonFx b{font-size:44px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35);} #seasonFx small{font-size:18px;color:#fff;font-weight:700;margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.4);}
  #seasonFx.s0{background:radial-gradient(circle,rgba(255,170,210,.55),rgba(255,170,210,0) 70%);} #seasonFx.s1{background:radial-gradient(circle,rgba(255,210,90,.55),rgba(255,210,90,0) 70%);}
  #seasonFx.s2{background:radial-gradient(circle,rgba(230,120,40,.55),rgba(230,120,40,0) 70%);} #seasonFx.s3{background:radial-gradient(circle,rgba(170,210,255,.6),rgba(170,210,255,0) 70%);}
  .minis{display:flex;gap:6px;}
  .round.mini{width:40px;height:40px;font-size:17px;position:relative;pointer-events:auto;}
  .round.mini.q2{background:linear-gradient(#c9b6ff,#8a6ad8);border-color:#563a9a;}
  .round.mini.q2.on{background:linear-gradient(#ffe38a,#f2b632);border-color:#b06200;}
  .round .dot{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:var(--red);border:2px solid #fff;display:none;}
  .round .dot.on{display:block;}
  #camCtl{position:absolute;right:8px;bottom:calc(14px + var(--sb));display:grid;grid-template-columns:40px 40px;gap:6px;pointer-events:auto;opacity:.85;}
  #camCtl.hide{display:none;}
  .loglist{display:flex;flex-direction:column;gap:4px;}
  .logrow{display:flex;gap:10px;background:var(--panel2);border-radius:10px;padding:6px 10px;font-weight:600;font-size:13.5px;}
  .logrow .lt{color:var(--muted);flex:none;min-width:74px;font-size:12px;padding-top:1px;}
  .helpi{font-weight:600;font-size:13.5px;margin:3px 2px;color:var(--cream);}
  .vol{display:flex;align-items:center;gap:8px;flex:1;} .vol input{flex:1;accent-color:#f2b632;}
  .big.q2{background:linear-gradient(#c9b6ff,#8a6ad8);box-shadow:0 4px 0 #563a9a;color:#1d0f3f;}
  .big.q2.on{background:linear-gradient(#ffe38a,#f2b632);box-shadow:0 4px 0 #b06200;}
  .chat{max-height:34vh;min-height:90px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px;background:#10283c;border-radius:14px;}
  .cb{max-width:82%;padding:7px 11px;border-radius:14px;font-weight:600;font-size:14.5px;line-height:1.3;white-space:pre-wrap;}
  .cb.me{align-self:flex-end;background:#2f6fae;border-bottom-right-radius:4px;}
  .cb .dd{display:block;font-size:11.5px;font-weight:800;margin-top:3px;opacity:.9;} .cb .dd.up{color:#9dffc0;} .cb .dd.dn{color:#ff9d8f;}
  .rev{background:rgba(255,255,255,.06);border-radius:10px;padding:6px 10px;margin:4px 0;} .rev .rh{font-size:13.5px;} .rev .rs{color:var(--gold2);float:right;letter-spacing:1px;} .rev .rt{font-size:13.5px;font-weight:600;opacity:.92;margin-top:2px;}
  .cb.them{align-self:flex-start;background:#2a4d6d;border-bottom-left-radius:4px;}
  .cb.typing{opacity:.7;font-style:italic;}
  .ugh{font-weight:800;font-size:13px;color:var(--gold2);margin:10px 4px 6px;letter-spacing:.3px;}
  details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 8px;margin:8px 0 6px;border-radius:10px;background:rgba(255,255,255,.05)}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary::after{content:'▸';margin-left:auto;transition:transform .15s}
  details.fold[open]>summary::after{transform:rotate(90deg)}
  #powerFx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(5,8,30,.55) 100%),rgba(10,15,40,.18);}
  #powerFx.on{opacity:1;animation:pflick 3.2s steps(1) infinite;}
  @keyframes pflick{0%,100%{opacity:1}47%{opacity:.75}49%{opacity:1}83%{opacity:.8}85%{opacity:1}}
  .sw{width:36px;height:36px;border-radius:50%;border:3px solid #2f5d85;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .sw.on{border-color:var(--gold2);transform:scale(1.1);}
  .tin{flex:1;min-width:0;height:40px;border-radius:12px;border:2px solid #2f5d85;background:#0f2436;color:var(--cream);font:700 16px inherit;padding:0 12px;font-family:inherit;}
  .tin:focus{outline:none;border-color:var(--gold2);}
  .asec{background:var(--panel2);border-radius:14px;padding:7px 9px 9px;margin-bottom:8px;}
  .asec .at{font-weight:800;font-size:14px;margin:0 0 6px 2px;}
  .agrid{display:flex;flex-wrap:wrap;gap:6px;}
  .abtn{min-height:36px;padding:3px 11px;font-size:13.5px;}
  .abtn.on{outline:2px solid var(--gold2);background:#264d70;color:var(--gold2);}
  .qclaim{animation:qpulse 1s ease-in-out infinite;}
  @keyframes qpulse{50%{transform:scale(1.06);}}
  #floors{position:absolute;left:8px;top:calc(100px + var(--st));display:flex;flex-direction:column;gap:6px;pointer-events:auto;}
  #floors button{position:relative;width:48px;height:42px;border-radius:12px;background:var(--panel);border:2px solid #2f5d85;color:var(--cream);font-weight:800;font-size:15px;cursor:pointer;}
  #floors button.on{border-color:var(--gold);color:var(--gold2);}
  #floors button.me::before{content:'🧑‍💼';position:absolute;right:-12px;top:-8px;font-size:15px;}
  #floors .dot{position:absolute;top:-5px;right:-5px;width:13px;height:13px;border-radius:50%;background:var(--red);border:2px solid #fff;}
  #carry{position:absolute;bottom:calc(14px + var(--sb));left:50%;transform:translateX(-50%);display:none;background:var(--panel);border:2px solid rgba(242,182,50,.6);border-radius:999px;padding:1px 14px;font-weight:800;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.28);}
  #carry.show{display:block;}
  #elevUI{position:absolute;bottom:calc(64px + var(--sb));left:50%;transform:translateX(-50%);display:none;gap:8px;}
  #elevUI.show{display:flex;}
  #elevUI button{height:52px;min-width:88px;border-radius:14px;border:none;background:linear-gradient(#5fd98a,#34a85f);box-shadow:0 4px 0 #1f7a43;color:#073018;font-weight:800;font-size:16px;cursor:pointer;padding:0 12px;}

  #joy{position:absolute;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);display:none;pointer-events:none;transform:translate(-50%,-50%);}
  #joy.show{display:block;}
  #joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 3px 8px rgba(0,0,0,.3);}
  #offArrow{position:absolute;left:0;top:0;width:46px;height:46px;display:none;align-items:center;justify-content:center;pointer-events:none;}
  #offArrow.show{display:flex;}
  #offArrow i{font-style:normal;font-size:30px;color:var(--gold2);filter:drop-shadow(0 2px 0 #6b4a00);}
  #hint{position:absolute;bottom:calc(130px + var(--sb));left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:6px 16px;font-weight:700;font-size:15px;text-align:center;display:none;pointer-events:none;max-width:88vw;}
  #hint.show{display:block;animation:tin .3s ease-out;}
  #toasts{position:absolute;top:calc(118px + var(--st));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90vw;}
  @media (max-width:520px){ #fsBtn{display:none;} }
  @media (max-width:440px){ .top{gap:4px;left:6px;right:6px;} .pill{height:36px;padding:1px 8px 1px 4px;gap:4px;} .money{font-size:16px;min-width:0;} .coin{width:20px;height:20px;} .stars{padding:0 7px;} #stars{font-size:12px;letter-spacing:0;} #repBar{width:44px;} .clock{font-size:13px;padding:0 7px;gap:3px;} .clock small{font-size:10px;} .round{width:36px;height:36px;font-size:16px;} #goal{font-size:12.5px;top:calc(84px + var(--st));max-width:calc(100vw - 150px);overflow:hidden;} #toasts{top:calc(118px + var(--st));} #lvlBox{top:calc(48px + var(--st));} }
  @media (max-width:370px){ .clock small{display:none;} }
  .pbar{height:7px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden;margin:3px 0;} .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));}
  #fixGame{position:absolute;left:50%;bottom:calc(120px + var(--sb));transform:translateX(-50%);background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:8px 10px;display:flex;gap:10px;align-items:center;pointer-events:auto;animation:tin .2s;}
  #fixGame .fgbar{position:relative;width:170px;height:16px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden;} #fixGame .fgz{position:absolute;top:0;bottom:0;background:#5fd98a;} #fixGame .fgm{position:absolute;top:-2px;width:5px;height:20px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 6px #fff;}
  .dgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:8px 0;background:#10283c;padding:6px;border-radius:12px;} .dcell{aspect-ratio:1;border-radius:8px;border:2px dashed #3b6a93;background:#1f4262;font-size:20px;color:var(--cream);cursor:pointer;} .dcell.off{border-style:solid;background:#2b3440;opacity:.5;cursor:default;} .dcell.has{border-style:solid;border-color:var(--gold2);background:#264d70;}
  .news{background:#f4efe3;color:#1b1b1b;border-radius:8px;padding:8px 10px;font-family:Georgia,serif;} .news b{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#6b5a45;} .news .nh{font-size:18px;font-weight:800;line-height:1.15;margin-top:2px;} .news .ns{font-size:13px;opacity:.85;margin-top:2px;}
  .citem{pointer-events:auto;cursor:pointer;display:inline-block;padding:0 1px;transition:transform .1s;} .citem:hover{transform:scale(1.25);}
  .toast.tap{pointer-events:auto;cursor:pointer;border-color:#7dffae;} .toast.tap:hover{filter:brightness(1.15);}
  .toast{background:var(--panel);border:2px solid var(--gold);padding:2px 14px 3px;border-radius:12px;font-weight:700;font-size:14px;animation:tin .25s ease-out;text-align:center;}
  .toast.bad{border-color:var(--red);}
  @keyframes tin{from{transform:translateY(-8px);opacity:0}}
  #banner{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;text-align:center;font-weight:800;font-size:36px;line-height:1.05;color:var(--gold2);text-shadow:0 3px 0 #6b4a00,0 0 22px rgba(0,0,0,.55);transition:transform .45s cubic-bezier(.3,1.7,.5,1),opacity .3s;width:92vw;}
  #banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .stabs{display:flex;gap:4px;overflow-x:auto;margin:-2px 0 10px;scrollbar-width:none}.stabs::-webkit-scrollbar{display:none}
  .stabs button{flex:0 0 auto;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--cream);border-radius:999px;padding:5px 9px;font:700 12.5px inherit;font-family:inherit;cursor:pointer;position:relative}
  .stabs button.on{background:var(--gold2);color:#3a2600;border-color:transparent}
  .sdot{position:absolute;top:1px;right:1px;width:8px;height:8px;border-radius:50%;background:#ff5a5a;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
  .tabs button{position:relative}
  .albg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
  .albc{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
  .albc.lock{opacity:.45}.albc .ae{font-size:28px}.albc .an{font-size:12px;font-weight:800;line-height:1.1;min-height:26px}.albc .at{color:var(--gold2);font-size:12px;letter-spacing:1px}.albc small{font-size:11px;opacity:.8}.albc .btn{padding:4px 8px;font-size:12px;margin-top:3px}
  .kv.me{background:rgba(255,210,74,.14);border-radius:8px}
  #goalText{overflow:hidden;text-overflow:ellipsis;min-width:0}
  @media (max-width:440px){ #banner{top:46%;font-size:28px;max-width:calc(100vw - 32px)} #banner small{font-size:14px} #goal{max-width:calc(100vw - 150px);font-size:12px;padding:2px 8px 3px} #livePill{max-width:calc(100vw - 150px)} #livePill .lbl{display:none} }
  #banner small{display:block;font-size:17px;color:var(--cream);text-shadow:0 2px 0 rgba(0,0,0,.6);margin-top:4px;}

  /* ---------- sheets & modals ---------- */
  .wrap{position:absolute;inset:0;background:rgba(5,15,25,.4);display:none;align-items:flex-end;justify-content:center;pointer-events:auto;}
  .wrap.show{display:flex;}
  .wrap.center{align-items:center;}
  .sheet{width:100%;max-width:560px;max-height:74vh;background:#17344d;border-radius:22px 22px 0 0;border-top:3px solid var(--gold);padding:12px 12px calc(14px + var(--sb));overflow:auto;animation:sheetIn .25s ease-out;}
  .card{width:min(92vw,400px);background:#17344d;border-radius:22px;border:3px solid var(--gold);padding:14px;animation:pop .3s cubic-bezier(.3,1.5,.5,1);max-height:86vh;overflow:auto;}
  @keyframes sheetIn{from{transform:translateY(40%);}}
  @keyframes pop{from{transform:scale(.7);opacity:0}}
  .sheet h3,.card h3{margin:0 0 2px;font-size:21px;display:flex;align-items:center;gap:8px;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 10px;font-weight:600;}
  .xbtn{margin-left:auto;width:36px;height:36px;border-radius:50%;border:none;background:#2a4d6d;color:var(--cream);font-size:17px;cursor:pointer;}
  .tabs{display:flex;gap:6px;margin:8px 0 10px;}
  .tabs button{flex:1;height:40px;border-radius:12px;border:2px solid #2f5d85;background:#1f4262;color:var(--cream);font-weight:800;font-size:14px;cursor:pointer;}
  .tabs button.on{border-color:var(--gold);color:var(--gold2);background:#264d70;}
  .row{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:14px;padding:8px 10px;margin-bottom:8px;}
  .row .ic{font-size:26px;width:36px;text-align:center;flex:none;}
  .row .tx{flex:1;line-height:1.15;min-width:0;font-weight:700;}
  .row .tx small{color:var(--muted);display:block;font-weight:600;font-size:12.5px;margin-top:1px;}
  .btn{border:none;border-radius:12px;min-height:38px;padding:4px 12px;font-weight:800;font-size:14px;background:linear-gradient(#5fd98a,#34a85f);color:#073018;box-shadow:0 3px 0 #1f7a43;cursor:pointer;white-space:nowrap;}
  .btn:disabled{filter:grayscale(1);opacity:.5;cursor:default;}
  .btn.gold{background:linear-gradient(#ffd45a,#f2a51d);color:#4a2a00;box-shadow:0 3px 0 #b06200;}
  .btn.ghost{background:#2a4d6d;color:var(--cream);box-shadow:0 3px 0 #173048;}
  .btn.red{background:linear-gradient(#f07a70,#d24c42);color:#fff;box-shadow:0 3px 0 #8a2620;}
  .btn.wide{width:100%;margin-top:6px;min-height:46px;font-size:16px;white-space:normal;line-height:1.2;padding:6px 12px;overflow-wrap:anywhere;}
  .pips{display:flex;gap:3px;margin-top:4px;}
  .pips i{width:15px;height:6px;border-radius:3px;background:#3b5d7c;}
  .pips i.on{background:var(--gold2);}
  .kv{display:flex;justify-content:space-between;padding:3px 2px;border-bottom:1px dashed #33597c;font-weight:700;font-size:15px;}
  .kv b{color:var(--gold2);}
  .kv.neg b{color:#ff9d8f;}
  .kv.tot{border-bottom:none;font-size:17px;margin-top:4px;}
  .note{color:var(--muted);font-size:13px;font-weight:600;margin:6px 2px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stat{background:var(--panel2);border-radius:12px;padding:6px 10px;font-weight:700;font-size:13px;color:var(--muted);}
  .stat b{display:block;color:var(--cream);font-size:18px;}
  #coinsFx{position:absolute;inset:0;pointer-events:none;}
  .flycoin{position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff5bd,#f2b632 55%,#b0740c);box-shadow:0 0 0 2px #8a5a06;will-change:transform;}
  #loadErr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px;}
  #boot{position:absolute;inset:0;background:#12293d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .5s;z-index:50;}
  #boot h1{margin:0;font-size:44px;color:var(--gold2);text-shadow:0 4px 0 #6b4a00;}
  #boot p{margin:0;color:var(--muted);font-weight:700;}
  @media (prefers-reduced-motion: reduce){ .bubble.req,.qclaim,#powerFx.on{animation:none;} #banner{transition:opacity .2s;} }
  @media (max-width:440px){ #calStrip{top:calc(116px + var(--st));font-size:12px} #toasts{top:calc(146px + var(--st))} }
</style>
</head>

<script>
